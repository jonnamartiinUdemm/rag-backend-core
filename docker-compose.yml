services:
  # API service
  web:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ./data:/app/data
    env_file:
      - .env

  # WORKER service celery
  worker:
    build: .
    command: celery -A app.core.celery_app worker --loglevel=info
    volumes:
      - .:/app
      - ./data:/app/data
    env_file:
      - .env

# Persistent volumes
volumes:
  redis_data: